[project]
name = "wifisec-suite"
version = "4.1.0"
description = "WiFi Security Suite - unified PySide6 app"
readme = "README.md"
license = { file = "LICENCE" }
authors = [
    { name = "Trixie Misheen" },
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
wifisec = "wifisec.ui.main_window:run"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wifisec"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
